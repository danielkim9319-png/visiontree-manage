:root{color-scheme:light;--ink:#203327;--leaf:#275641;--muted:#536557;--cream:#f7f5ed;--paper:#fffdf8;--line:#dbded2;--bark:#594437;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--cream)}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9bab58;outline-offset:2px}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1260px)/2));border-bottom:1px solid var(--line);background:var(--paper);gap:18px}.brand{display:flex;align-items:center;gap:14px;line-height:1.35}.brand img{width:104px;max-height:42px;object-fit:contain}.brand strong{font-size:15px}.brand small{display:block;color:var(--muted);font-size:12px}.layout{max-width:1260px;margin:0 auto;padding:40px 24px 64px}.login{display:grid;grid-template-columns:1.05fr 1fr;max-width:990px;margin:32px auto 0;min-height:460px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:0 18px 55px #2f423012}.intro{position:relative;overflow:hidden;background:linear-gradient(135deg,#173c2e,#315940);color:#fffdf5;display:flex;flex-direction:column;justify-content:center;padding:58px}.intro:before,.intro:after{content:"";position:absolute;pointer-events:none;width:490px;height:410px;border:1px solid #d1dcaa40;border-radius:46%;right:-250px;bottom:-215px;box-shadow:0 0 0 16px #d1dcaa20,0 0 0 33px #d1dcaa18,0 0 0 50px #d1dcaa18,0 0 0 68px #d1dcaa15;transform:rotate(-30deg)}.intro:after{right:auto;left:-410px;top:-275px}.intro h1{font-size:clamp(31px,4vw,49px);letter-spacing:-.07em;line-height:1.18;margin:12px 0 17px}.intro p{margin:0;color:#e5e8d6;line-height:1.7}.overline{font-size:12px;font-weight:700;letter-spacing:.07em;color:#d7e6a7}.form-box{padding:52px 54px;align-self:center}.form-box h2,.panel h2{margin:0 0 10px;letter-spacing:-.045em}.muted{color:var(--muted);line-height:1.55}.form-box p{margin:0 0 24px;font-size:14px}label{display:block;font-size:14px;font-weight:650;margin:0 0 15px}input,select,textarea{display:block;width:100%;padding:11px 13px;margin-top:7px;background:#fff;border:1px solid #bfc9bc;border-radius:9px;color:var(--ink)}textarea{resize:vertical;min-height:90px}.primary,.quiet,nav button{border:1px solid transparent;border-radius:9px;padding:11px 15px;font-weight:700}.primary{background:var(--leaf);color:white}.form-box .primary{width:100%;margin-top:3px}.quiet{background:#e9eee3;color:var(--leaf)}.msg{color:#a12e25;font-size:14px;min-height:1.5em;margin-top:12px}.msg.ok{color:var(--leaf)}.dashboard{display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px}nav{display:flex;flex-direction:column;gap:7px}nav button{text-align:left;background:transparent;color:var(--ink)}nav button[aria-current=page]{background:#dce8d8;color:#184333}.hero{border-radius:18px;background:#244c39;color:#fffdf5;padding:30px;margin:0 0 18px}.hero h1{margin:7px 0;font-size:32px;letter-spacing:-.05em}.hero p{margin:0;color:#e0e9d8}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:15px}.card,.panel{border:1px solid var(--line);border-radius:15px;background:var(--paper);padding:19px}.card strong{display:block;font-size:29px;margin-top:7px}.panel{margin-bottom:14px}.bar{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.bar label{min-width:155px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}td,th{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}th{background:#e9eee3}.pill{display:inline-block;border-radius:20px;padding:4px 10px;background:#e5efe3;font-size:13px}.report{padding:12px 0;border-top:1px solid var(--line)}.report p{white-space:pre-wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}[hidden]{display:none!important}

<body><header><div class="brand"><button id="brand-home" class="brand-home" type="button" aria-label="비전트리 홈"><img src="visiontree-logo.png" alt="VisionTree"></button><div><strong>비전트리 목양 관리 시스템</strong><small>안산동산교회 본당고등부</small></div></div><button id="logout" class="quiet" hidden>로그아웃</button></header>
<main class="layout" id="app" aria-live="polite"><p class="muted">접속 상태를 확인하고 있습니다.</p></main>
<script>
const app=document.querySelector('#app'),logout=document.querySelector('#logout');
const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let classTeachers={},storedProfiles=null;
const readCache=new Map(),inflight=new Map();
function rememberRead(path,body){readCache.set(path,{at:Date.now(),body});}
const roomLabel=(room,id)=>classTeachers[id]?room+'('+classTeachers[id]+')':room;
const label=id=>{const parts=(id||'').split('/');if(parts.length===3)parts[2]=roomLabel(parts[2],id);return parts.join(' · ');};
let phoneMode=false;
let user,view='홈',data,classes=[],selected='',profileScope='',week='',error='';
const keys=[['11',6],['12',6],['21',5],['22',6],['31',5],['32',5]].flatMap(([g,n])=>Array.from({length:n},(_,i)=>g[0]+'마을/'+g+'조/'+(i+1)+'반'));
// 구글 시트 데이터를 불러오는 Apps Script 웹 앱 주소 (배포를 새로 만들면 이 주소만 바꾸세요)
const API='https://script.google.com/macros/s/AKfycbzajKmg763YcAv-xLSpkMyDzJIZDiViGksuKu5ONE_zTvOfIKv_9Wd40RNgA7ud2yJpIA/exec';
function sessionToken(next){
  try{
    if(next===null)sessionStorage.removeItem('visiontree-session');
    else if(next)sessionStorage.setItem('visiontree-session',next);
    return sessionStorage.getItem('visiontree-session')||'';
  }catch{return '';}
}
async function api(path,payload,fresh){
  const reading=payload===undefined;
  if(!reading)readCache.clear();
  if(reading&&inflight.has(path))return inflight.get(path);
  if(reading&&!fresh){
    const hit=readCache.get(path);
    if(hit&&Date.now()-hit.at<60000)return hit.body;
  }
  const run=(async()=>{
    const url=new URL(API);
    url.searchParams.set('path',path);
    const token=sessionToken();
    if(token)url.searchParams.set('token',token);
    const options={method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload===undefined?null:payload)};
    let res;
    try{res=await fetch(url,options);}
    catch{throw Error('웹 앱에 연결하지 못했습니다.');}
    const body=await res.json().catch(()=>({error:'응답을 확인하지 못했습니다.'}));
    if(!res.ok||body.error)throw Error(body.error||'요청을 처리하지 못했습니다.');
    if(body.token)sessionToken(body.token);
    if(path==='logout')sessionToken(null);
    if(reading)rememberRead(path,body);
    return body;
  })();
  if(reading){inflight.set(path,run);run.finally(()=>inflight.delete(path));}
  return run;
}
function applySnapshot(status){
  classTeachers=status.teachers||classTeachers;
  if(Array.isArray(status.classes)){
    data={connected:true,classes:status.classes,syncedAt:status.syncedAt||''};
    classes=status.classes;
    rememberRead('roster',data);
  }
  if(Array.isArray(status.profiles)){
    storedProfiles=status.profiles;
    rememberRead('student-profiles',{syncedAt:status.syncedAt||'',profiles:status.profiles});
  }
  if(Array.isArray(status.newcomers))rememberRead('newcomers?year='+newcomerToday().slice(0,4),{rows:status.newcomers});
}
function message(el,value,ok=false){el.textContent=value;el.classList.toggle('ok',ok);}
function login(setup=false,initial='',account=null){
  logout.hidden=true;
  app.innerHTML='<section class="login"><div class="intro"><span class="overline">안산동산교회 본당고등부</span><h1>비전트리<br>목양 관리 시스템</h1><p>복음으로 뿌리내려 제자되어 자라나고 사랑으로 열매맺자! 푸르르게 자라나고 서로의 그늘이 되는 우리는 비전트리!</p></div><div class="form-box"><h2>'+ (setup?'관리자 초기 설정':'로그인') +'</h2><p class="muted">'+(setup?'관리자로 사용할 이름과 PIN을 등록해 주세요.':'등록된 이름과 PIN을 입력해 주세요.')+'</p><form id="auth"><label>이름<input name="name" autocomplete="username" maxlength="40" required></label><label>PIN 번호<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{8,12}" autocomplete="'+(setup?'new-password':'current-password')+'" required placeholder="숫자 8~12자리"></label><label class="remember-name"><input type="checkbox" id="remember-name">이름 저장</label><button class="primary">'+(setup?'관리자 계정 만들기':'로그인')+'</button><div class="msg" id="auth-msg" role="status"></div></form></div></section>';
  const form=document.querySelector('#auth'), msg=document.querySelector('#auth-msg');
  if(phoneMode){
    form.insertAdjacentHTML('afterbegin','<label>휴대전화 번호<input name="phone" type="tel" autocomplete="username" required maxlength="15"></label>');
    document.querySelector('.form-box p').textContent=setup?'관리자 휴대전화 번호와 초기 설정 키를 입력해 주세요.':'등록된 휴대전화 번호와 PIN을 입력해 주세요.';
    if(setup){
      form.insertAdjacentHTML('afterbegin','<label>초기 설정 키<input type="password" name="setupKey" required autocomplete="off"></label>');
      form.elements.pin.pattern='[0-9]{10,12}';form.elements.pin.placeholder='숫자 10~12자리';
      form.elements.name.autocomplete='name';
    }else{
      form.elements.name.required=false;form.elements.name.closest('label').hidden=true;
    }
    form.querySelector('.remember-name').hidden=true;
  }
  if(account?.email){
    const hint=document.createElement('p');
    hint.className='muted';
    hint.textContent='현재 계정 · '+account.email+' ';
    const switchAccount=document.createElement('a');
    switchAccount.href='/signout-with-chatgpt?return_to=%2F';
    switchAccount.target='_top';
    switchAccount.textContent='계정 바꾸기';
    hint.append(switchAccount);
    form.before(hint);
  }
  const remember=document.querySelector('#remember-name');
  const storageKey=account?.email?'visiontree-login-name:'+account.email:null;
  try{
    const saved=storageKey&&localStorage.getItem(storageKey);
    if(saved){form.elements.name.value=saved;remember.checked=true;}
  }catch{}
  remember.onchange=()=>{
    if(!remember.checked&&storageKey)try{localStorage.removeItem(storageKey);}catch{}
  };
  message(msg,initial);
  form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;message(msg,'');try{await api(setup?'setup':'login',Object.fromEntries(new FormData(form)));try{if(storageKey&&remember.checked)localStorage.setItem(storageKey,form.elements.name.value.trim());}catch{}await boot();}catch(e){message(msg,e.message);form.elements.pin.value='';form.elements.pin.focus();}finally{button.disabled=false;}};
}
async function boot(){
  try {
    const status=await api('status');
    if(!status.user)phoneMode=status.authMode==='phone';
    if(!status.user){login(status.setup,!phoneMode&&!status.setup&&!status.registered?'등록된 교사 계정을 확인해 주세요.': '',status);return;}
    user=status.user;phoneMode=status.authMode==='phone';logout.hidden=false;view='홈';data=null;classes=[];storedProfiles=null;selected=defaultClass();profileScope='';week='';error='';
    applySnapshot(status);
    if(!data){
      render();
      try{data=await api('roster');classes=data.classes;error='';}
      catch(e){error=e.message;}
    }
    render();
  } catch(e){login(false,e.message);}
}
logout.onclick=async()=>{try{await api('logout',{});user=null;data=null;classes=[];await boot();}catch(e){error=e.message;render();}};
document.querySelector('#brand-home').onclick=()=>{if(user){view='홈';render();}};
const roleNames={admin:'사역자',executive:'임원',village:'마을장',group:'조장',teacher:'반교사',newcomer:'새친구',worship:'예배팀'};
const worshipTeams=['방송','위더스','SNS/테마/친사','비스킷','헬퍼'];
const staffDepth={village:1,group:2,teacher:3};
const availableClasses=()=>keys.filter(x=>user.role==='admin'||(staffDepth[user.role]&&(x===user.classId||x.startsWith(user.classId+'/'))));
const lockedClassDepth=()=>user.classId?(staffDepth[user.role]||0):0;
const defaultClass=()=>user.role==='admin'?'':availableClasses()[0]||'';
function initialAttendanceClass(){
  const allowed=availableClasses();
  const loaded=classes.filter(c=>allowed.includes(c.id));
  return loaded.find(c=>c.students?.length)?.id||loaded[0]?.id||allowed[0]||'';
}
const picker=()=>'<div class="bar" id="class-filter"></div>';
function mountClassPicker(container,choices,initial,depth,changed,lockedDepth=0,includeAll=false){
  let parts=(initial||'').split('/').filter(Boolean).slice(0,depth);
  function draw(focus){
    container.hidden=depth===0;
    container.replaceChildren();
    const titles=['마을','조','반'];
    for(let i=0;i<depth;i++){
      const prefix=parts.slice(0,i);
      const options=i>parts.length?[]:[...new Set(choices.map(id=>id.split('/')).filter(id=>prefix.every((value,j)=>id[j]===value)).map(id=>id[i]))];
      const field=document.createElement('label'), select=document.createElement('select');
      field.textContent=titles[i];
      select.setAttribute('aria-label',titles[i]);
      select.add(new Option(includeAll?'전체':titles[i]+' 선택',''));
      for(const value of options){
        const id=[...prefix,value].join('/');
        select.add(new Option(i===2?roomLabel(value,id):value,value));
      }
      select.value=parts[i]||'';
      select.disabled=i<lockedDepth||!options.length;
      select.onchange=()=>{
        parts=parts.slice(0,i);
        if(select.value)parts.push(select.value);
        draw(i);
        changed(parts.join('/'));
      };
      field.append(select);container.append(field);
      if(focus===i)select.focus();
    }
  }
  draw();
}

function attendanceDates(classes){
  const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
  const iso=d=>{const [m,day]=d.match(/\d+/g);return '2026-'+m.padStart(2,'0')+'-'+day.padStart(2,'0');};
  return [...new Set(classes.flatMap(c=>c.dates))]
    .filter(d=>/^\d{1,2}월 \d{1,2}일$/.test(d)&&iso(d)<=today)
    .sort((a,b)=>iso(b).localeCompare(iso(a)));
}
function reportWeeks(){
  const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
  const sunday=new Date(today+'T00:00:00Z');
  sunday.setUTCDate(sunday.getUTCDate()-sunday.getUTCDay());
  return Array.from({length:52},(_,i)=>new Date(sunday.getTime()-i*604800000).toISOString().slice(0,10));
}

function deltaLabel(value,previous){
  if(value===null||previous===null||previous===undefined)return '';
  const diff=value-previous;
  const sign=diff>0?'▲ ':diff<0?'▼ ':'변동 없음';
  return '<span class="metric-note '+(diff>0?'delta-up':diff<0?'delta-down':'muted')+'">'+sign+(diff?Math.abs(diff)+'명':'')+'</span>';
}
function markCount(list,date){
  let enrolled=0,attended=0,absent=0;
  for(const c of list){
    const index=c.dates.indexOf(date);
    const iso=date&&('2026-'+date.replace(/^(\d{1,2})월 (\d{1,2})일$/,(_,m,d)=>m.padStart(2,'0')+'-'+d.padStart(2,'0')));
    for(const s of c.students){
      if(s.registered&&iso&&s.registered>iso)continue;
      enrolled++;
      if(present(s.attendance[index]))attended++;
      if(['결','무'].includes(s.attendance[index]))absent++;
    }
  }
  return {enrolled,attended:attended+absent?attended:null,absent:attended+absent?absent:null};
}

function renderAttendance(c,date){
  const box=document.querySelector('#attendance-editor');
  if(!box)return;
  try{
    const index=c.dates.indexOf(date);
    if(index<0){box.textContent='이 반의 해당 주차 기록이 없습니다.';return;}
    const [month,day]=date.match(/\d+/g);
    const dayKey='2026-'+month.padStart(2,'0')+'-'+day.padStart(2,'0');
    const students=c.students.filter(s=>!s.registered||s.registered<=dayKey);
    const special=c.students.some(s=>s.attendance[index]==='모두예배');
    const canEdit=!special;
    const note=special?'모두예배 주차입니다.':'변경한 학생만 저장합니다.';
    box.innerHTML=table(['이름','현재 출결',...(canEdit?['입력']:[])],students.map(s=>[
      s.name,markLabels[s.attendance[index]]||'미입력',...(canEdit?['']:[])
    ]))+'<p class="muted" role="status" id="attendance-note">'+safe(note)+'</p>'+
      (canEdit?'<button class="primary" id="attendance-save" disabled>출결 저장</button>':'');
    if(!canEdit)return;
    const changes=new Map(), save=box.querySelector('#attendance-save'), msg=box.querySelector('#attendance-note');
    box.querySelectorAll('tbody tr').forEach((row,i)=>{
      const student=students[i],previous=student.attendance[index]||'';
      const cell=row.lastElementChild;
      cell.replaceChildren();
      const duplicate=students.some((s,j)=>i!==j&&s.name===student.name);
      if(duplicate){cell.textContent='동명이인 · 시트에서 확인';return;}
      const buttons=[];
      for(const mark of ['출','결']){
        const b=document.createElement('button');
        b.type='button';b.className='quiet attendance-mark';b.textContent=markLabels[mark];
        b.setAttribute('aria-pressed',String(mark===previous));
        b.onclick=()=>{
          if(mark===previous)changes.delete(i);
          else changes.set(i,{name:student.name,previous,mark});
          buttons.forEach(([button,value])=>button.setAttribute('aria-pressed',String(value===mark)));
          save.disabled=!changes.size;save.dataset.dirty=String(changes.size>0);
        };
        buttons.push([b,mark]);cell.append(b);
      }
    });
    save.onclick=async()=>{
      save.disabled=true;
      box.querySelectorAll('.attendance-mark').forEach(b=>b.disabled=true);
      try{
        const saved=await api('attendance',{classId:c.id,date,changes:[...changes.values()]});
        if(Array.isArray(saved.classes)){
          data={connected:true,classes:saved.classes,syncedAt:saved.syncedAt||''};
          classes=saved.classes;rememberRead('roster',data);
        }else{
          const updated=await api('roster',undefined,true);
          data=updated;classes=updated.classes;
        }
        error='';
        if(box.isConnected)render();
      }catch(e){
        if(!box.isConnected)return;
        message(msg,e.message);
        save.disabled=false;
        box.querySelectorAll('.attendance-mark').forEach(b=>b.disabled=false);
      }
    };
  }catch(e){if(box.isConnected)box.textContent=e.message;}
}

async function pollSync(path,active,onState){
  for(let attempt=0;attempt<45;attempt++){
    if(!active())return;
    try{
      const {state}=await api(path);
      if(!active()||onState(state))return;
    }catch(e){if(active())onState('error');return;}
    await new Promise(resolve=>setTimeout(resolve,3000));
  }
  if(active())onState('waiting');
}

const statRoles=['admin','executive'];
const statPages={attendance:'출석통계',absence:'장결자',trend:'전체 출석 인원',school:'학교별 분류',area:'거주지별 분류',birthday:'생일'};
const statBands={'':'전체','4-6':'4주 ~ 6개월','6-12':'6개월 ~ 1년','12-24':'1년 ~ 2년','24+':'2년 이상'};

const statOptions=(values,current)=>values.map(([value,label])=>'<option value="'+safe(value)+'"'+(value===current?' selected':'')+'>'+safe(label)+'</option>').join('');
const statSelect=(title,id,values,current)=>'<label>'+title+'<select data-stat-filter="'+id+'">'+statOptions(values,current)+'</select></label>';

const statPresent=mark=>['출','지','온라인'].includes(mark);
const statAbsent=mark=>['결','무'].includes(mark);
const statComparable=mark=>statPresent(mark)||statAbsent(mark);
function statIso(label){
  const parts=String(label||'').match(/^(\d{1,2})월 (\d{1,2})일$/);
  if(!parts)return '';
  const iso='2026-'+parts[1].padStart(2,'0')+'-'+parts[2].padStart(2,'0');
  const day=new Date(iso+'T00:00:00Z');
  return Number.isNaN(day.getTime())||day.toISOString().slice(0,10)!==iso?'':iso;
}
function statShift(date,months,days=0){
  const [year,month,day]=date.split('-').map(Number);
  const start=new Date(Date.UTC(year,month-1+months,1));
  const last=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate();
  start.setUTCDate(Math.min(day,last)+days);
  return start.toISOString().slice(0,10);
}
function statArea(raw){
  const tokens=String(raw||'').trim().split(/[\s,()]+/).filter(token=>/^[가-힣0-9·]+[동읍면]$/.test(token));
  return tokens.at(-1)||'';
}
function localStatistics(mode,filter){
  const today=newcomerToday();
  const village=filter.village||'';
  const scoped=classes.filter(item=>!village||item.id.startsWith(village+'/'));
  const seen=new Set(),dates=[];
  const roster=[];
  for(const item of scoped){
    const isoDates=item.dates.map(statIso);
    for(const date of isoDates)if(date&&date<=today&&!seen.has(date)){seen.add(date);dates.push(date);}
    for(const student of item.students)roster.push({name:student.name,classId:item.id,marks:student.attendance,dates:isoDates});
  }
  dates.sort();
  if(mode==='attendance'){
    const classId=filter.classId||'';
    const date=dates.includes(filter.date)?filter.date:dates.at(-1)||'';
    const rows=date?roster.filter(row=>!classId||row.classId===classId||row.classId.startsWith(classId+'/')).map(row=>{
      const markIndex=row.dates.indexOf(date);
      return {name:row.name,classId:row.classId,mark:markIndex<0?'':row.marks[markIndex]||''};
    }):[];
    return {dates,classes:scoped.map(item=>item.id),date,rows};
  }
  if(mode==='trend'){
    const length=[8,12,26,52].includes(Number(filter.length))?Number(filter.length):8;
    const sunday=statShift(today,0,-new Date(today+'T00:00:00Z').getUTCDay());
    const villages=village?[village]:['1마을','2마을','3마을'];
    const series=[];
    for(let i=0;i<length;i++){
      const date=statShift(sunday,0,-7*(length-1-i));
      const counts={};
      for(const key of villages){
        const marks=roster.filter(row=>row.classId.startsWith(key+'/')).map(row=>{
          const markIndex=row.dates.indexOf(date);
          return markIndex<0?'':row.marks[markIndex]||'';
        });
        counts[key]=marks.some(statComparable)?marks.filter(statPresent).length:null;
      }
      const values=villages.map(key=>counts[key]).filter(value=>value!==null);
      series.push({date,counts,total:values.length?values.reduce((sum,value)=>sum+value,0):null});
    }
    const averages={};
    for(const key of [...villages,'전체']){
      const values=series.map(row=>key==='전체'?row.total:row.counts[key]).filter(value=>value!==null);
      averages[key]=values.length?values.reduce((sum,value)=>sum+value,0)/values.length:null;
    }
    return {series,averages,villages};
  }
  const profileMap=new Map();
  for(const profile of storedProfiles||[]){
    const key=profile.classId+'\n'+profile.name;
    profileMap.set(key,profileMap.has(key)?null:profile);
  }
  const rows=roster.map(row=>{
    const profile=profileMap.get(row.classId+'\n'+row.name);
    const item={name:row.name,classId:row.classId,school:profile?.school||'',area:profile?statArea(profile.area):'',birth:profile?.birth||'',phone:profile?.phone||'',guardianPhone:profile?.guardianPhone||''};
    if(mode!=='absence')return item;
    const history=[];
    row.dates.forEach((date,markIndex)=>{if(date&&date<=today)history.push({date,mark:row.marks[markIndex]||''});});
    history.sort((a,b)=>a.date<b.date?-1:1);
    const comparable=history.filter(entry=>statComparable(entry.mark));
    const last=comparable.length?comparable.at(-1).mark:'';
    if(!statAbsent(last))return {...item,band:''};
    let lastPresent='',firstAbsent='';
    for(const entry of history){
      if(statPresent(entry.mark))lastPresent=entry.date;
      if(!firstAbsent&&statAbsent(entry.mark))firstAbsent=entry.date;
    }
    const start=lastPresent||firstAbsent;
    let band='';
    if(start&&start<=statShift(today,0,-28))band=start<=statShift(today,-24)?'24+':start<=statShift(today,-12)?'12-24':start<=statShift(today,-6)?'6-12':'4-6';
    return {...item,band,lastPresent,firstAbsent};
  });
  const choice=filter.choice||'';
  const keyword=String(filter.q||'').trim().toLowerCase().slice(0,100);
  const eligible=rows.filter(row=>!keyword||row.name.toLowerCase().includes(keyword)||String(row.school||'').toLowerCase().includes(keyword));
  const options=mode==='school'||mode==='area'?[...new Set(eligible.map(row=>row[mode]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko')):[];
  const filtered=eligible.filter(row=>{
    if(mode==='absence')return row.band&&(!choice||row.band===choice);
    if(mode==='birthday')return choice&&String(row.birth||'').startsWith(String(choice).padStart(2,'0')+'-');
    if(mode==='school'&&!choice)return true;
    return choice&&row[mode]===choice;
  });
  if(mode==='birthday')filtered.sort((a,b)=>String(a.birth).localeCompare(String(b.birth))||a.name.localeCompare(b.name,'ko'));
  const counts=mode==='absence'?{'4-6':0,'6-12':0,'12-24':0,'24+':0}:undefined;
  if(counts)for(const row of eligible)if(counts[row.band]!==undefined)counts[row.band]+=1;
  return {rows:filtered,options,counts};
}

function renderTrend(box,{series,averages,villages}){
  const lines=villages.length===1?villages:['전체',...villages];
  const colors={'전체':'#1d523d','1마을':'#705038','2마을':'#ad5932','3마을':'#486493'};
  const value=(row,key)=>key==='전체'?row.total:row.counts[key];
  box.innerHTML='<div class="cards trend-summary'+(lines.length===4?' trend-summary-all':'')+'">'+lines.map(key=>'<div class="card">'+key+' 평균 출석<strong>'+
    (averages[key]===null?'—':averages[key].toFixed(1)+'명')+'</strong></div>').join('')+'</div>'+
    '<p class="muted">미입력·모두예배 주차는 평균에서 제외합니다. 전체 인원은 출결이 입력된 마을의 합계입니다.</p>'+
    '<div class="scroll"><canvas width="860" height="300" aria-label="주차별 출석 인원 선 그래프" role="img"></canvas></div>'+
    '<div class="bar">'+lines.map(key=>'<span style="color:'+colors[key]+'">● '+key+'</span>').join('')+'</div>'+
    table(['주차',...lines],series.toReversed().map(row=>[row.date,...lines.map(key=>value(row,key)===null?'—':value(row,key)+'명')]));
  const canvas=box.querySelector('canvas'), ctx=canvas.getContext('2d');
  const start=52,end=838,top=24,bottom=258;
  const max=Math.max(10,...series.flatMap(row=>lines.map(key=>value(row,key)||0)));
  const step=Math.ceil(max/50)*10;
  const x=i=>start+i*(end-start)/Math.max(1,series.length-1);
  const y=n=>bottom-n*(bottom-top)/(step*5);
  ctx.font='12px system-ui';
  ctx.fillStyle='#536557';
  ctx.fillText('명',18,14);
  for(let i=0;i<=5;i++){
    ctx.strokeStyle='#dbded2';ctx.beginPath();ctx.moveTo(start,y(i*step));ctx.lineTo(end,y(i*step));ctx.stroke();
    ctx.fillText(String(i*step),12,y(i*step)+4);
  }
  const labelStep=Math.ceil(series.length/8);
  series.forEach((row,i)=>{if(i%labelStep===0||i===series.length-1)ctx.fillText(row.date.slice(5),x(i)-16,bottom+20);});
  for(const key of lines){
    ctx.strokeStyle=ctx.fillStyle=colors[key];ctx.lineWidth=2;
    let previous=null;
    series.forEach((row,i)=>{
      const count=value(row,key);
      if(count===null){previous=null;return;}
      if(previous){ctx.beginPath();ctx.moveTo(...previous);ctx.lineTo(x(i),y(count));ctx.stroke();}
      ctx.beginPath();ctx.arc(x(i),y(count),3,0,2*Math.PI);ctx.fill();
      previous=[x(i),y(count)];
    });
  }
}

      const {dates,selected,rows}=await api('management?mode=attendance-missing&date='+encodeURIComponent(date));
      if(!box.isConnected)return;
      filters.innerHTML=statSelect('주차','date',dates.map(d=>[d,d]),selected);
      filters.querySelector('select').onchange=e=>load(e.target.value);
      const complete=rows.filter(r=>r.status==='done').length;
      const missing=rows.filter(r=>['missing','partial','failed'].includes(r.status)).length;
      const pending=rows.filter(r=>r.status==='pending').length;
      const except=rows.length-complete-missing-pending;
      box.innerHTML='<div class="kpis">'+metric('제출 완료',complete+'반','done')+metric('미제출·일부 입력',missing+'반','waiting')+
        metric('반영 중',pending+'반')+metric('집계 제외',except+'반')+'</div>'+
        '<p class="muted">출석부에 대상 학생 전원의 출결이 기록되면 제출 완료로 집계합니다. 모두예배와 대상이 없는 반은 제외합니다.</p>'+
        table(['마을','조','반','담임 교사','입력 인원','상태'],rows.map(row=>[...row.id.split('/'),row.teacher,row.marked+' / '+row.total,labels[row.status]]));
    }catch(e){if(box.isConnected)box.textContent=e.message;}
  }
  load();
}

async function renderTeacherDirectory(panel,notice='',query=''){
  panel.innerHTML='<h2>교사 명단</h2><div class="bar filter-strip">'+statSelect('직책·겸직','role',
    [['','전체'],...directoryRoleNames.map(name=>[name,name])],directoryFilter)+
    '<label>이름 검색<input type="search" id="teacher-query" maxlength="80"></label></div><div id="teacher-edit"></div><div id="teacher-results">불러오는 중입니다.</div>';
  const box=panel.querySelector('#teacher-results'), select=panel.querySelector('select'), search=panel.querySelector('#teacher-query');
  search.value=query;
  try{
    const {rows,syncedAt}=await api('management?mode=directory');
    if(!box.isConnected)return;
    if(!syncedAt){box.textContent='출석부에서 교사 명단을 동기화하는 중입니다.';return;}
    const editor=panel.querySelector('#teacher-edit');
    function editTeacher(row){
      const match=(row.birth||'').match(/^((?:19|20)\d{2})[.\/-]\s*(\d{1,2})[.\/-]\s*(\d{1,2})\.?$/);
      const birth=match?match[1]+'-'+match[2].padStart(2,'0')+'-'+match[3].padStart(2,'0'):'';
      editor.innerHTML='<form class="panel"><h3>교사 정보 수정</h3><div class="formgrid">'+
        '<label>이름<input name="name" required maxlength="7" value="'+safe(row.name)+'"></label>'+
        '<label>연락처<input name="phone" type="tel" maxlength="30" value="'+safe(row.phone)+'"></label>'+
        '<label>생년월일<input name="birth" type="date" value="'+safe(birth)+'"></label>'+
        '<label>성별<select name="gender">'+statOptions([['','미기재'],['남','남'],['여','여']],row.gender)+'</select></label>'+
        '<label>직책<select name="role" required>'+statOptions(directoryRoleNames.map(role=>[role,role]),row.role)+'</select></label></div>'+
        '<fieldset class="new-choice"><legend>겸직</legend>'+directoryRoleNames.map(role=>'<label><input type="checkbox" name="tags" value="'+safe(role)+'"'+
          (row.tags.includes(role)&&role!==row.role?' checked':'')+'>'+safe(role)+'</label>').join('')+'</fieldset>'+
        '<button class="primary">원본 시트에 저장</button> <button type="button" class="quiet">취소</button><div class="msg" role="status"></div></form>';
      const form=editor.querySelector('form');
      const original=Object.fromEntries(new FormData(form));
      const originalTags=new FormData(form).getAll('tags');
      form.querySelector('[type=button]').onclick=()=>editor.replaceChildren();
      form.onsubmit=async e=>{
        e.preventDefault();e.submitter.disabled=true;
        const fields=new FormData(form), tags=fields.getAll('tags');
        const values=Object.fromEntries([...fields].filter(([key,value])=>!['tags','role'].includes(key)&&value!==original[key]));
        if(fields.get('role')!==original.role||tags.join('|')!==originalTags.join('|')){
          values.role=fields.get('role');values.tags=tags;
        }
        if(!Object.keys(values).length){editor.replaceChildren();return;}
        try{
          const result=await api('management',{action:'edit-teacher',id:row.id,...values});
          if(!result.pending){editor.textContent='저장했습니다.';return;}
          const status=form.querySelector('.msg');
          message(status,'원본 시트에 반영하는 중입니다.',true);
          pollSync('management?mode=teacher-edit-status&id='+encodeURIComponent(result.jobId),()=>panel.isConnected,state=>{
            if(state==='pending')return false;
            if(state==='applied'){
              api('status').then(result=>{classTeachers=result.teachers||classTeachers;}).catch(()=>{});
              renderTeacherDirectory(panel,'원본 시트와 웹앱에 수정 내용을 반영했습니다.',values.name||search.value);
            }else{
              renderTeacherDirectory(panel,state==='conflict'?'원본이 변경됐습니다. 최신 정보를 확인하고 다시 수정해 주세요.':'아직 반영 확인 중입니다. 잠시 뒤 다시 확인해 주세요.',search.value);
            }
            return true;
          });
        }catch(e){message(form.querySelector('.msg'),e.message);form.querySelector('.primary').disabled=false;}
      };
      form.elements.name.focus();
    }
    if(notice){const status=document.createElement('p');status.className='muted';status.textContent=notice;editor.replaceChildren(status);}
    function show(){
      directoryFilter=select.value;
      const query=search.value.trim().toLowerCase();
      const rank=role=>{const index=directoryRoleNames.indexOf(role);return index<0?directoryRoleNames.length:index;};
      const found=rows.filter(r=>(!directoryFilter||r.tags.includes(directoryFilter))&&r.name.toLowerCase().includes(query))
        .sort((a,b)=>rank(a.role)-rank(b.role)||a.name.localeCompare(b.name,'ko'));
      const rolesFor=row=>{
        const primary=directoryFilter||row.role;
        return [primary,...row.tags.filter(role=>role!==primary).sort((a,b)=>rank(a)-rank(b))].join(' · ');
      };
      const issues=found.filter(r=>r.notes.includes('확인')).length;
      box.innerHTML='<div class="section-head"><span class="pill">'+found.length+'명 · 확인 필요 '+issues+'건</span></div>'+
        table(['이름','연락처','성별','생년월일','직책','겸직 및 확인 사항','관리'],found.map(r=>[r.name,r.phone,r.gender,r.birth,rolesFor(r),r.notes,'']));
      box.querySelectorAll('tbody tr').forEach((tr,i)=>{
        const row=found[i], button=document.createElement('button');
        button.className='quiet';button.textContent='삭제';
        const edit=document.createElement('button');
        edit.type='button';edit.className='quiet';edit.textContent='수정';
        edit.disabled=!row.canEdit||row.editState==='pending';
        edit.onclick=()=>editTeacher(row);
        const state={pending:'원본 반영 중',conflict:'원본 변경 확인 필요',applied:'반영 완료'}[row.editState]||'';
        tr.lastElementChild.replaceChildren(edit,' ',button,state?' '+state:'');
        button.onclick=async()=>{
          if(!window.confirm(row.name+' 선생님을 웹앱 교사 명단에서 삭제할까요?'))return;
          button.disabled=true;
          try{
            await api('management',{action:'hide-teacher',id:row.id});
            rows.splice(rows.indexOf(row),1);show();
          }catch(e){button.disabled=false;window.alert(e.message);}
        };
      });
    }
    select.onchange=show;search.oninput=show;show();
    if(rows.some(row=>row.editState==='pending')){
      const refresh=document.createElement('button');refresh.className='quiet';refresh.textContent='반영 상태 새로고침';
      refresh.onclick=()=>renderTeacherDirectory(panel);panel.append(refresh);
    }
  }catch(e){if(box.isConnected)box.textContent=e.message;}
}

boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
